name: ci

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22.18', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: git identity for the end-to-end repositories
        run: |
          git config --global user.email "ci@router-worker.invalid"
          git config --global user.name "router-worker ci"
          git config --global init.defaultBranch main
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - name: the CLI runs from source with no build
        run: node src/cli.ts help
